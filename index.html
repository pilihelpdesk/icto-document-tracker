<title>ICTO Document Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Caslon+Text:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe2;--card:#fff;--text:#1f2a24;--muted:#6b7280;--line:#2a2a2a;--head:#efede2;--green:#2b6144;--green2:#3f7a55;--dgreen:#1f4a34;--gold:#d4a72c;--ok:#1e7a46;--req:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a16;--card:#20261f;--text:#eef0e8;--muted:#a3aa9c;--line:#8e9a86;--head:#2b3328;--ok:#5ad18a;--req:#ff7b7b}}
:root[data-theme="dark"]{--bg:#161a16;--card:#20261f;--text:#eef0e8;--muted:#a3aa9c;--line:#8e9a86;--head:#2b3328;--ok:#5ad18a;--req:#ff7b7b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.4 Inter,Arial,Helvetica,sans-serif}
.top{background:var(--green);border-bottom:6px solid var(--gold);color:#fff}
.top-in{max-width:none;margin:0;padding:10px 24px;display:flex;align-items:center;gap:14px}
.top img{width:72px;height:72px;border-radius:50%;flex:none}
.ttl{font:700 30px/1.1 "Libre Caslon Text",Georgia,serif;text-transform:uppercase}
.sub{margin-top:4px;font-size:14px;font-weight:500;text-transform:uppercase}
.pillmode{margin-left:auto;background:var(--gold);color:#3b2d00;font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;white-space:nowrap}
.app{flex:1;width:100%;max-width:none;margin:0;padding:18px 24px 30px;display:flex;gap:22px;align-items:flex-start}
.side{width:200px;flex:none;position:sticky;top:16px;border:1.5px solid var(--green2);border-radius:30px;padding:16px 12px;min-height:340px}
.tabs{display:flex;flex-direction:column;gap:12px}
.tab{width:100%;padding:17px 8px;border:0;border-radius:12px;background:var(--green2);color:#fff;font:800 14px Inter,Arial,sans-serif;letter-spacing:.8px;text-transform:uppercase;cursor:pointer}
.tab:hover{filter:brightness(1.08)}
.tab.on{background:var(--gold);color:#4a3a05}
.tab:focus-visible,.btn:focus-visible,.stab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.main{flex:1;min-width:0}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border-radius:18px;box-shadow:0 2px 14px rgba(40,60,40,.14);padding:26px 28px 22px}
.ch{text-align:center;margin-bottom:18px}
.ch h1{margin:0;font-size:17px;font-weight:700;text-transform:uppercase}
.ch p{margin:3px 0 0;color:var(--muted);font-size:13px}
.frm{border:1px solid var(--line)}
.row{display:grid;grid-template-columns:30% 1fr;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.lab{padding:9px 12px;background:var(--head);border-right:1px solid var(--line);font-size:13px;font-weight:600}
.val{display:flex}
.val input,.val select,.val textarea{width:100%;border:0;border-radius:0;background:transparent;color:var(--text);font:14px Inter,Arial,sans-serif;padding:9px 12px}
.val textarea{resize:vertical;height:52px}
.val input::placeholder,.val textarea::placeholder{color:var(--muted);opacity:.75}
.val :focus{outline:2px solid var(--gold);outline-offset:-2px}
.invalid{background:rgba(200,40,40,.12)!important}
.bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding-top:16px}
#msg,#rmsg{font-weight:600;font-size:13px}
#msg{margin-right:auto}
.ok{color:var(--ok)}.err{color:var(--req)}
.btn{border:0;border-radius:10px;padding:11px 22px;font:700 13px Inter,Arial,sans-serif;letter-spacing:.6px;text-transform:uppercase;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.save{background:var(--green);color:#fff}.clr{background:var(--gold);color:#3b2d00}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:0 0 12px}
.fl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.foot b{font-size:12px;text-transform:uppercase}
.foot select{height:30px;font:600 13px Inter,Arial,sans-serif;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);padding:0 8px;min-width:64px}
.tot{background:var(--gold);color:#3b2d00;border-radius:999px;font-size:12px;font-weight:700;padding:5px 12px;text-transform:uppercase}
.stabs{display:flex;flex-wrap:nowrap;gap:6px;padding-bottom:12px;overflow-x:auto}
.stab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);font:700 12px Inter,Arial,sans-serif;cursor:pointer}
.stab i{font-style:normal;font-size:11px;background:var(--green);color:#fff;border-radius:999px;padding:1px 7px}
.stab:hover:not(.on){background:var(--head)}
.stbl{border:1px solid var(--line)}
.sthead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:13px;font-weight:700;text-transform:uppercase;border-bottom:1px solid var(--line)}
.sthead span{font-size:11px;font-weight:600;opacity:.9}
.sscroll{max-height:214px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:820px;font-size:13px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:center;height:30px}
th{background:var(--head);font-size:12px;font-weight:700;text-transform:uppercase;position:sticky;top:0;z-index:1}
td.l{text-align:left}
td.sub{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:block;padding:3px 8px;border-radius:9px;font-size:11px;font-weight:700;white-space:nowrap}
.act{background:none;border:0;font:800 12px Inter,Arial,sans-serif;cursor:pointer;padding:2px 6px;text-transform:uppercase}
.ed{color:#1d4ed8}.dl{color:#dc2626}
.empty td{color:var(--muted);height:60px}
.site-foot{background:var(--dgreen);border-top:5px solid var(--gold);color:#fff;text-align:center;padding:26px 16px;font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ovl.on{display:flex}
.modal{background:var(--card);color:var(--text);width:100%;max-width:420px;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--green);color:#fff;border-bottom:4px solid var(--gold)}
.mhead h2{margin:0;font-size:15px;font-weight:700;text-transform:uppercase}
.mclose{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;line-height:1}
.mbody{padding:18px 20px;font-size:14px;line-height:1.5}
.mfoot{display:flex;justify-content:flex-end;padding:0 16px 16px}
@media (max-width:800px){.app{flex-direction:column}.side{width:100%;position:static;min-height:0;border-radius:18px}.tabs{flex-direction:row}.tab{padding:12px 6px}.ttl{font-size:20px}.sub{font-size:11px}.top img{width:48px;height:48px}.pillmode{display:none}.card{padding:18px 14px}.row{grid-template-columns:1fr}.lab{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>

  else return s;
  if(isNaN(d.getTime()))return s;
  return MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function say(t,c){["msg","rmsg"].forEach(function(i){$(i).textContent=t;$(i).className=c||""})}

// build form
$("frm").innerHTML=F.map(function(f){
  var h,id=f[0],ph=f[4]||"";
  if(f[2]=="sel")h='<select id="'+id+'"><option value="">'+ph+'</option>'+f[5].map(function(o){return"<option>"+esc(o)+"</option>"}).join("")+"</select>";
  else if(f[2]=="area")h='<textarea id="'+id+'" placeholder="'+ph+'"></textarea>';
  else h='<input id="'+id+'" type="'+f[2]+'" placeholder="'+ph+'">';
  return'<div class="row" id="row-'+id+'"'+(id=="statusNote"?' style="display:none"':"")+'><label class="lab" for="'+id+'">'+f[1]+(f[3]?'':"")+'</label><div class="val">'+h+"</div></div>";
}).join("");

function reset(){F.forEach(function(f){var e=$(f[0]);e.value="";e.classList.remove("invalid")});$("dateReceived").value=today();editId=null;updateNote()}
var NOTES={"Received":["Received From","Enter who or which office it was received from","from"],"On Process":["Being Processed By","Enter who or which office is processing it","by"],"Forwarded":["Forwarded To (Office)","Type the office it was forwarded to","to"],"Completed":["Completion Details","Enter completion details","" ],"Pending":["Reason for Pending","Enter why it is pending",""],"Filed":["Filed At","Enter where it was filed","at"],"For Approval":["For Approval By","Enter who will approve it","by"],"For Signature":["For Signature By","Enter who will sign it","by"],"On Hold":["Reason for Hold","Enter why it is on hold",""]};
function updateNote(){var v=$("status").value,n=NOTES[v],r=$("row-statusNote");r.style.display=n?"":"none";if(n){r.querySelector(".lab").innerHTML=n[0];$("statusNote").placeholder=n[1]}else{$("statusNote").value=""}$("statusNote").classList.remove("invalid")}
function load(){try{docs=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){docs=[]}docs.forEach(function(d,i){if(!d.id)d.id="d"+Date.now()+i})}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(docs))}catch(e){say("Storage unavailable: saved for this session only.","err")}}

function haveBackend(){return APPS_SCRIPT_URL&&APPS_SCRIPT_URL.indexOf("PASTE_YOUR")==-1}
function api(params){
  var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k]==null?"":params[k])}).join("&");
  return fetch(APPS_SCRIPT_URL+"?"+qs).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){if(!j||j.ok===false)throw new Error((j&&j.error)||"request failed");return j});
}

async function initStorage(){
  if(!haveBackend()){
    mode="local";load();filters();render();
    say("No Google Sheets backend configured yet — working from this browser's local storage.","err");
    return;
  }
  mode="sheets";
  await refreshFromSheet();
}
async function refreshFromSheet(){
  try{
    say("Loading records from Google Sheets…");
    var j=await api({cmd:"list"});
    docs=[];rowMap={};
    (j.rows||[]).forEach(function(r){var d={};HEADER.forEach(function(h){d[h]=r[h]||""});docs.push(d);rowMap[d.id]=r._row});
    filters();render();say("");
  }catch(e){say("Couldn't reach Google Sheets: "+e.message,"err")}
}

function view(){
  var m=$("fm").value,y=$("fy").value;
  return docs.filter(function(d){var p=(d.dateReceived||"").split("-");return(m===""||+p[1]-1==m)&&(y===""||p[0]==y)}).sort(function(a,b){return(b.dateReceived||"").localeCompare(a.dateReceived||"")});
}
function pill(t,c){return'<span class="pill" style="background:'+c[0]+";color:"+c[1]+'">'+esc(t)+"</span>"}
function filters(){
  var fm=$("fm"),fy=$("fy"),m=fm.value,y=fy.value;
  fm.innerHTML='<option value="">All</option>'+MON.map(function(n,i){return'<option value="'+i+'">'+n+"</option>"}).join("");
  var ys={};docs.forEach(function(d){if(d.dateReceived)ys[d.dateReceived.split("-")[0]]=1});
  fy.innerHTML='<option value="">All</option>'+Object.keys(ys).sort().reverse().map(function(v){return"<option>"+v+"</option>"}).join("");
  fm.value=m;fy.value=y;
}
function rowHtml(d){
  var note=d.statusNote?esc(((NOTES[d.status]||[])[2]||"")+" "+d.statusNote):"";
  return"<tr><td>"+fmt(d.dateReceived)+'</td><td class="l">'+esc(d.docType)+"</td><td>"+pill(d.type,["#93c5fd","#000"])+'</td><td class="l sub" title="'+esc(d.subject)+'">'+esc(d.subject)+"</td><td>"+esc(d.assignedTo)+'</td><td class="l sub" title="'+note+'">'+note+"</td><td>"+fmt(d.due)+'</td><td><button class="act ed" data-e="'+d.id+'">Edit</button><button class="act dl" data-d="'+d.id+'">Del</button></td></tr>';
}
function render(){
  var rows=view();
  $("tot").textContent="Total: "+rows.length;
  var byStatus={};rows.forEach(function(d){(byStatus[d.status]||(byStatus[d.status]=[])).push(d)});
  if(STATUS.indexOf(curStatus)<0)curStatus=STATUS[0];
  $("stabs").innerHTML=STATUS.map(function(st){
    var c=SCOL[st]||["#ddd","#000"],n=(byStatus[st]||[]).length,on=st==curStatus;
    return'<button type="button" class="stab'+(on?" on":"")+'" role="tab" aria-selected="'+on+'" data-st="'+esc(st)+'"'+(on?' style="background:'+c[0]+";color:"+c[1]+'"':"")+'>'+esc(st)+'<i>'+n+'</i></button>';
  }).join("");
  $("tables").innerHTML=[curStatus].map(function(st){
    var list=byStatus[st]||[],col=SCOL[st]||["#ddd","#000"],noteLab=(NOTES[st]||["Details"])[0];
    var body=list.length?list.map(rowHtml).join(""):'<tr class="empty"><td colspan="8">No documents with this status.</td></tr>';
    return'<div class="stbl"><div class="sthead" style="background:'+col[0]+";color:"+col[1]+'"><span style="font-size:13px">'+esc(st)+'</span><span>'+list.length+' record'+(list.length==1?"":"s")+'</span></div>'
      +'<div class="sscroll"><table><thead><tr><th>Date</th><th>Document Type</th><th>Transaction Type</th><th>Subject</th><th>Assigned To</th><th>'+esc(noteLab)+'</th><th>Due Date</th><th>Actions</th></tr></thead><tbody>'+body+"</tbody></table></div></div>";
  }).join("");
}

$("stabs").onclick=function(e){var b=e.target.closest("[data-st]");if(!b)return;curStatus=b.getAttribute("data-st");render()};
$("save").onclick=async function(){
  var bad=false,d={},hasInput=false;
  F.forEach(function(f){var e=$(f[0]),v=e.value.trim();d[f[0]]=v;e.classList.remove("invalid");if(v&&f[0]!="dateReceived")hasInput=true});
  if(!hasInput){
    notice("No Information Entered","Please provide at least one detail before saving this document.");
    return;
  }
  $("save").disabled=true;
  if(mode=="sheets"){
    d.id=editId||("d"+Date.now());
    d.updatedAt=new Date().toISOString();
    var params={cmd:"save"};HEADER.forEach(function(h){params[h]=d[h]});
    if(editId&&rowMap[editId])params._row=rowMap[editId];
    try{
      var j=await api(params);
      if(j.row)rowMap[d.id]=j.row;
      if(editId){var i=docs.findIndex(function(x){return x.id==editId});if(i>-1)docs[i]=d}
      else docs.unshift(d);
      reset();filters();render();say("Document saved to Google Sheets.","ok");
    }catch(e){say("Couldn't save: "+e.message,"err")}
  }else{
    if(editId){var i=docs.findIndex(function(x){return x.id==editId});d.id=editId;if(i>-1)docs[i]=d;else docs.unshift(d)}
    else{d.id="d"+Date.now();docs.unshift(d)}
    persist();reset();filters();render();say("Document saved.","ok");
  }
  $("save").disabled=false;
};
$("clear").onclick=function(){reset();say("")};
function showTab(n){
  ["input","records"].forEach(function(t){
    $("tab-"+t).classList.toggle("on",t==n);
    $("tabBtn-"+t).classList.toggle("on",t==n);
    $("tabBtn-"+t).setAttribute("aria-selected",t==n?"true":"false");
  });
  if(n=="records"){if(mode=="sheets")refreshFromSheet();else render()}
  window.scrollTo({top:0});
}
function notice(title,msg){$("ntitle").textContent=title;$("nbody").textContent=msg;$("novl").classList.add("on")}
function closeNotice(){$("novl").classList.remove("on")}
$("nok").onclick=closeNotice;$("nclose").onclick=closeNotice;
$("novl").onclick=function(e){if(e.target.id=="novl")closeNotice()};
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){showTab(b.getAttribute("data-tab"))}});
document.addEventListener("keydown",function(e){if(e.key=="Escape")closeNotice()});
$("tables").onclick=async function(e){
  var t=e.target,id=t.getAttribute("data-d"),ed=t.getAttribute("data-e");
  if(id){
    if(mode=="sheets"){
      var row=rowMap[id];
      if(row){
        t.disabled=true;
        try{
          await api({cmd:"delete",_row:row});
          docs=docs.filter(function(d){return d.id!=id});delete rowMap[id];filters();render();say("Document deleted.","ok");
        }catch(err){say("Couldn't delete: "+err.message,"err");t.disabled=false}
      }
    }else{
      docs=docs.filter(function(d){return d.id!=id});persist();filters();render();
    }
  }
  if(ed){var d=docs.find(function(x){return x.id==ed});if(!d)return;F.forEach(function(f){$(f[0]).value=d[f[0]]||""});editId=ed;updateNote();say("Editing entry. Press Save Document to update.","ok");showTab("input")}
};
$("status").onchange=function(){$("statusNote").value="";updateNote()};
$("fm").onchange=$("fy").onchange=function(){render()};

function setPill(){$("modePill").textContent=mode=="sheets"?"Live · Google Sheets":"Local storage"}
reset();initStorage().then(setPill);
</script>
</body>
</html>
